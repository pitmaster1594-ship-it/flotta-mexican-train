y:none}.handpanel{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#102e30f7;border-top:1px solid #9dbb8d55;box-shadow:0 -12px 40px #071c2466;backdrop-filter:blur(16px);padding:14px max(24px,calc((100vw - 1352px)/2)) max(14px,env(safe-area-inset-bottom));margin:0}.handtitle h2{margin:0;font-size:15px}.handwrap{display:flex;overflow-x:auto;gap:11px;align-items:center;min-height:84px;padding:12px 5px 14px;overscroll-behavior-x:contain;scrollbar-width:thin;touch-action:pan-x}.handwrap.reordering .tile{touch-action:none}.tile.dragging{opacity:.55}.tile.drop-target{outline:3px dashed var(--gold)}.hand-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.arrange-tools{padding-top:10px}.how{font-size:13px;line-height:1.6;color:var(--muted);margin:18px 0}.how summary{font-weight:650}.how p{margin-top:10px}.overlay{position:fixed;inset:0;z-index:20;background:#092330ed;display:grid;place-items:center;padding:24px}.modal{background:#173b3c;border:1px solid #6b9e89;border-radius:20px;padding:28px;max-width:520px;width:100%;text-align:center;max-height:90dvh;overflow:auto}.modal p{line-height:1.6}.options{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px 0}.divider{border:0;border-top:1px solid #ffffff25;margin:20px 0}.welcome{max-width:700px;margin:12vh auto 0;text-align:center;background:#123c36;padding:36px;border:1px solid #ffffff22;border-radius:20px}.welcome h1{font-size:36px}.welcome p{line-height:1.6}.lobby #app{padding-bottom:24px}.arranging #app{padding-bottom:350px}

</style></head><body><div id="app"></div><script>
(()=>{'use strict';const app=document.getElementById('app');const START=12;let state=null;let seq=0;let timer=null;let arranging=false;const expandedTrains=new Set();let ignoreNextClick=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeDeck(){let a=[];for(let i=0;i<=12;i++)for(let j=i;j<=12;j++)if(!(i===state.engine&&j===state.engine))a.push({id:++seq,a:i,b:j});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function players(mode){return mode===1?[{name:'You',human:true},{name:'Computer 1',human:false},{name:'Computer 2',human:false},{name:'Computer 3',human:false}]:[{name:'Player 1',human:true},{name:'Computer 1',human:false},{name:'Player 2',human:true},{name:'Computer 2',human:false}]}
function newGame(mode=1){expandedTrains.clear();arranging=false;clearTimeout(timer);state={mode,engine:START,round:0,players:players(mode),total:[0,0,0,0],phase:'play',current:0,turnDraw:false,pending:null,selected:null,selectedTrain:null,notice:'',awaiting:false,passes:0};dealRound()}
function dealRound(){clearTimeout(timer);state.players.forEach(p=>{p.hand=[];p.train=[];p.open=false});let deck=makeDeck();for(let i=0;i<15;i++)for(let p of state.players)p.hand.push(deck.pop());state.boneyard=deck;state.mex=[];state.current=0;state.turnDraw=false;state.pending=null;state.selected=null;state.selectedTrain=null;state.phase='play';state.passes=0;state.awaiting=false;state.notice='Round '+(state.round+1)+': double-'+state.engine+' starts all trains.';startTurn()}
function head(t){return t==='m'?state.mex.length?state.mex.at(-1).right:state.engine:state.players[t].train.length?state.players[t].train.at(-1).right:state.engine}
function accessible(t,p){return t==='m'||t===p||state.players[t].open}
function eligible(t,p){if(state.pending!==null)return state.pending===t;return accessible(t,p)}
function fitting(tile,t){let h=head(t);if(tile.a===h)return {left:tile.a,right:tile.b};if(tile.b===h)return {left:tile.b,right:tile.a};return null}
function moves(p){let opts=[];for(let ti of state.players[p].hand)for(let t of ['m',0,1,2,3])if(eligible(t,p)){let orient=fitting(ti,t);if(orient)opts.push({ti,t,...orient})}return opts}
function name(t){return t==='m'?'Mexican Train':state.players[t].name+"'s train"}
function nextPlayer(){arranging=false;state.current=(state.current+1)%4;state.turnDraw=false;state.selected=null;state.selectedTrain=null;startTurn()}
function endTurn(){if(state.players[state.current].hand.length===0){finishRound(state.current);return}state.passes=0;nextPlayer()}
function doPlay(m){let p=state.current,pl=state.players[p];let ix=pl.hand.findIndex(t=>t.id===m.ti.id);if(ix<0)return;pl.hand.splice(ix,1);const entry={...m.ti,left:m.left,right:m.right};if(m.t==='m')state.mex.push(entry);else{state.players[m.t].train.push(entry);if(m.t===p)pl.open=false}let hadPending=state.pending!==null;state.pending=null;state.turnDraw=false;state.selected=null;state.selectedTrain=null;state.notice=pl.name+' played '+m.left+'–'+m.right+' on '+name(m.t)+'.';if(m.left===m.right){state.pending=m.t;state.notice+=' Double! The next play must satisfy it.'}if(pl.hand.length===0){finishRound(p);return}state.passes=0;nextPlayer()}
function drawOne(){if(state.boneyard.length===0)return false;state.players[state.current].hand.push(state.boneyard.pop());state.turnDraw=true;state.notice=state.players[state.current].name+' drew a domino.';return true}
function cantPlay(){let p=state.current;if(state.pending===null)state.players[p].open=true;state.notice=state.players[p].name+' could not play. '+(state.pending===null?'Their train is now open.':'The double still needs matching.');state.passes++;if(state.passes>=4&&state.boneyard.length===0){finishRound(null);return}nextPlayer()}
function score(p){return state.players[p].hand.reduce((v,t)=>v+t.a+t.b,0)}
function finishRound(winner){state.phase='roundend';for(let i=0;i<4;i++)state.total[i]+=score(i);state.notice=winner===null?'No more plays available.':state.players[winner].name+' finished their dominoes!';render()}
function startTurn(){render();if(state.phase!=='play')return;let p=state.current;if(state.players[p].human){state.awaiting=state.mode===2;render()}else{state.awaiting=false;render();timer=setTimeout(computerMove,650)}}
function computerMove(){if(!state||state.phase!=='play'||state.players[state.current].human)return;let p=state.current;let opts=moves(p);if(opts.length){opts.sort((a,b)=>((b.ti.a+b.ti.b)-(a.ti.a+a.ti.b)) + ((a.t===p?1:0)-(b.t===p?1:0)));doPlay(opts[0]);return}if(!state.turnDraw&&drawOne()){render();timer=setTimeout(computerMove,500);return}cantPlay()}
const pipColors=['#89939b','#d44845','#2580c9','#28a06c','#b579c7','#d29b24','#152b38','#dc6a36','#934dba','#318892','#a2556a','#77882c','#d34c77'];
function face(v){return `<span class="numberface" style="color:${pipColors[v]}">${v}</span>`}
function shownEnds(t){return t.flipped?[t.b,t.a]:[t.a,t.b]}
function domino(t,cls='',disable=false,clickable=true){let [a,b]=shownEnds(t);return `<${clickable?'button':'span'} class="tile ${cls}" ${clickable?`data-tile="${t.id}" aria-pressed="${state?.selected===t.id}" ${disable?'disabled':''}`:''} aria-label="Domino ${a} ${b}"><span class="side pips">${face(a)}</span><span class="side pips">${face(b)}</span></${clickable?'button':'span'}>`}
function routeDominoes(list){return list.length?`<div class="route-row">${list.map(x=>domino({id:x.id,a:x.left,b:x.right},'small',false,false)).join('')}</div>`:'<p class="mini">No dominoes yet. Start with '+state.engine+'.</p>'}
function viewingPlayer(){return state.mode===1?0:state.players[state.current].human?state.current:state.current===1?0:2}
function trainHTML(t,place){const p=state.current,pl=state.players[p],list=t==='m'?state.mex:state.players[t].train,allowed=state.phase==='play'&&pl.human&&!state.awaiting&&eligible(t,p),s=pl.hand.find(x=>x.id===state.selected),can=allowed&&s&&fitting(s,t),open=t==='m'||state.players[t].open,own=t===viewingPlayer();return `<section class="train ${place} ${allowed?'available':''} ${state.pending===t?'double-wait':''}" aria-label="${t==='m'?'Mexican Train':esc(state.players[t].name)+' train'}"><details data-history="${t}" ${innerWidth>700||expandedTrains.has(String(t))?'open':''}><summary><div class="trainhead"><span class="trainname">${t==='m'?'🚂 Mexican Train':own?'Your train':esc(state.players[t].name)} <span class="trainstatus ${open?'open':''}">${state.pending===t?'Match double':t==='m'?'Shared':open?'Open':'Closed'}</span><span class="expand-hint">Show history</span></span><span class="end-badge">End <b>${head(t)}</b></span></div></summary><div class="trail">${routeDominoes(list)}</div></details><div class="train-preview">${list.length?list.slice(-2).map(x=>domino({id:x.id,a:x.left,b:x.right},'small',false,false)).join('')+`<span>${list.length} played</span>`:'Start with '+state.engine}</div>${allowed?`<div class="train-action"><button class="btn ${can?'primary':'secondary'}" data-target="${t}" ${!can?'disabled':''}>${can?'Play selected domino here':s?'No match':'Select a domino to play'}</button></div>`:''}</section>`}
function render(){const oldHand=app.querySelector('.handwrap[data-owner]');const handScroll=oldHand&&state&&oldHand.dataset.owner===String(state.current)?oldHand.scrollLeft:0;if(!state){document.body.classList.add('lobby');app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><span class="pill">Dominoes · Double 12</span></div><div class="welcome"><h1>All aboard!</h1><p>Build your domino trains, play against computer opponents, and keep your score as low as possible.</p><div class="options"><button class="btn primary" data-new="1">1 player + 3 computers</button><button class="btn primary" data-new="2">2 players + 2 computers</button></div><hr class="divider"><p class="how">Same-iPad two-player mode uses a private pass screen between human turns. This game plays one domino per turn, draws one when stuck, and requires doubles to be satisfied. House rules can be adjusted later.</p></div>`;return}
let p=state.current,pl=state.players[p],opts=state.phase==='play'?moves(p):[],human=pl.human&&!state.awaiting,hide=state.awaiting;
document.body.classList.remove('lobby');document.body.classList.toggle('arranging',arranging&&human&&state.phase==='play');
const viewer=viewingPlayer(),opponents=[0,1,2,3].filter(i=>i!==viewer);
app.innerHTML=`<header class="top"><div class="brand">🚂 Flotta Mexican Train</div><div class="controls"><span class="pill">Round ${state.round+1} / 13</span><button class="btn secondary" data-reset="1">New game</button></div></header><section class="status-panel"><div class="turnline"><div class="turntitle">${state.phase==='play'?esc(pl.name)+(pl.human?' — your turn':' is thinking…'):'Round complete'}</div><span class="engine-badge">Starting double <b>${state.engine} | ${state.engine}</b> · Boneyard <b>${state.boneyard.length}</b></span></div><div class="scores">${state.players.map((x,i)=>`<div class="score ${i===p?'current':''}">${esc(x.name)} · <b>${state.total[i]}</b> pts · ${x.hand.length} tiles</div>`).join('')}</div><p class="message" role="status">${state.pending!==null?'⚠ Match the double on '+esc(name(state.pending))+'. ':''}${esc(state.notice)}</p></section><section class="tablepanel"><div class="tabletools"><h2>The table</h2><span class="eyebrow">${state.phase==='play'&&human?'Select a tile · choose a train':'Lowest score wins'}</span></div><div class="tabletop">${trainHTML('m','shared')}${opponents.map(i=>trainHTML(i,'opponent')).join('')}${trainHTML(viewer,'personal')}</div></section><section class="handpanel"><div class="handtitle"><h2>${state.phase==='play'&&human?'Your hand · '+pl.hand.length+' dominoes':'Your hand'}</h2>${state.phase==='play'&&human?`<button class="btn secondary" data-arrange="1" aria-expanded="${arranging}">${arranging?'Done arranging':'Arrange'}</button>`:'<span class="mini">Waiting for your turn</span>'}</div>${state.phase==='play'&&human?`<div class="handrail"><button class="btn secondary hand-nav" data-hand-scroll="left" aria-label="Show previous dominoes" aria-controls="player-hand">‹</button><div id="player-hand" tabindex="0" data-owner="${p}" class="handwrap ${arranging?'reordering':''}" aria-label="Your dominoes">${pl.hand.map(t=>domino(t,'hand '+(state.selected===t.id?'sel ':'')+(opts.some(m=>m.ti.id===t.id)?'suggest':''))).join('')}</div><button class="btn secondary hand-nav" data-hand-scroll="right" aria-label="Show next dominoes" aria-controls="player-hand">›</button></div><div class="hand-actions"><span class="mini">${state.turnDraw?'Domino drawn. Play it if you can.':opts.length?'Swipe or use ‹ › to see all tiles. Select one to play.':'No matching tiles. '+(state.boneyard.length?'Draw one to continue.':'You can pass.')}</span><div class="controls"><button class="btn ${!opts.length&&!state.turnDraw&&state.boneyard.length?'primary':'secondary'}" data-draw="1" ${state.turnDraw||opts.length||!state.boneyard.length?'disabled':''}>Draw (${state.boneyard.length})</button><button class="btn ${!opts.length&&(state.turnDraw||!state.boneyard.length)?'primary':'secondary'}" data-pass="1" ${(!state.turnDraw&&state.boneyard.length>0)||opts.length?'disabled':''}>Pass</button></div></div>${arranging?`<div class="controls arrange-tools"><span class="mini">Drag to reorder, or select and move:</span><button class="btn secondary" data-move="left" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===0?'disabled':''}>◀ Left</button><button class="btn secondary" data-move="right" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===pl.hand.length-1?'disabled':''}>Right ▶</button><button class="btn secondary" data-flip="1" ${state.selected===null?'disabled':''}>Flip</button><button class="btn secondary" data-sort="1">Sort numbers</button></div>`:''}`:`<div class="handwrap"><p class="muted">${state.phase==='play'?'The next hand appears when it is your turn.':'Round complete. See the scores above.'}</p></div>`}</section><details class="how"><summary>How to play · House rules</summary><p>Play on your own train, any open train, or the shared Mexican Train. Draw one if you cannot play; if still stuck, pass. Passing opens your train unless a double is waiting. This version plays one domino per turn, including doubles: the next player must match the double before playing elsewhere. Lowest total pip score after 13 rounds wins.</p></details>`;
const newHand=app.querySelector('.handwrap[data-owner]');if(newHand)newHand.scrollLeft=handScroll;
if(state.phase==='roundend'){const last=state.engine===0;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>${last?'🏆 Game over':'🎉 Round finished'}</h1><p>${esc(state.notice)}</p><div class="scores" style="justify-content:center">${state.players.map((x,i)=>`<div class="score">${esc(x.name)}<br>Round: ${score(i)} · Total: <b>${state.total[i]}</b></div>`).join('')}</div><div class="options">${last?`<button class="btn primary" data-new="${state.mode}">Play again</button>`:'<button class="btn primary" data-next="1">Next round</button>'}</div>${last?`<p>Winner: ${esc(state.players[state.total.indexOf(Math.min(...state.total))].name)} (lowest score).</p>`:''}</div></div>`)}
if(state.awaiting&&state.phase==='play'){app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>🙈 Pass the iPad</h1><p>Hand the iPad to <strong>${esc(pl.name)}</strong>. Other players should look away before you reveal the hand.</p><button class="btn primary" data-reveal="1">I'm ${esc(pl.name)} — reveal my dominoes</button></div></div>`)}
}
// Pointer-based hand reordering works with fingers, pens and mice.
let dragState=null;
app.addEventListener('toggle',e=>{if(innerWidth<=700&&e.target.matches('details[data-history]')){const key=e.target.dataset.history;if(e.target.open)expandedTrains.add(key);else expandedTrains.delete(key)}},true);
matchMedia('(max-width:700px)').addEventListener('change',()=>{if(state)render()});
app.addEventListener('pointerdown',e=>{const el=e.target.closest('.handwrap [data-tile]');if(!arranging||!el||!state||state.awaiting||!state.players[state.current].human)return;dragState={id:Number(el.dataset.tile),x:e.clientX,y:e.clientY,active:false,pointer:e.pointerId,el};try{el.setPointerCapture(e.pointerId)}catch(_){};},{passive:true});
app.addEventListener('pointermove',e=>{if(!dragState||e.pointerId!==dragState.pointer)return;if(Math.abs(e.clientX-dragState.x)>12||Math.abs(e.clientY-dragState.y)>12){dragState.active=true;dragState.el.classList.add('dragging');const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');document.querySelectorAll('.handwrap .drop-target').forEach(n=>n.classList.remove('drop-target'));if(dest&&dest!==dragState.el)dest.classList.add('drop-target')}},{passive:true});
function endDrag(e){if(!dragState||e.pointerId!==dragState.pointer)return;const d=dragState;dragState=null;document.querySelectorAll('.handwrap .drop-target').forEach(n=>n.classList.remove('drop-target'));if(!d.active)return;try{d.el.releasePointerCapture(d.pointer)}catch(_){};ignoreNextClick=true;setTimeout(()=>ignoreNextClick=false,100);const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');if(!dest||!state||state.awaiting)return;const hand=state.players[state.current].hand;const from=hand.findIndex(t=>t.id===d.id),to=hand.findIndex(t=>t.id===Number(dest.dataset.tile));if(from<0||to<0||from===to)return;const [tile]=hand.splice(from,1);hand.splice(to,0,tile);state.selected=tile.id;render()}
app.addEventListener('pointerup',endDrag);app.addEventListener('pointercancel',()=>{dragState=null;});
app.addEventListener('click',e=>{if(innerWidth>700&&e.target.closest('.train summary')){e.preventDefault();return}if(ignoreNextClick){ignoreNextClick=false;return;}let b=e.target.closest('[data-hand-scroll],[data-arrange],[data-new],[data-reset],[data-next],[data-reveal],[data-tile],[data-target],[data-draw],[data-pass],[data-move],[data-sort],[data-flip]');if(!b)return;if(b.dataset.new){newGame(Number(b.dataset.new));return}if(b.dataset.reset){if(confirm('Start a new game?')){state=null;render()}return}if(b.dataset.next){state.round++;state.engine--;dealRound();return}if(b.dataset.reveal){state.awaiting=false;render();return}if(!state||state.phase!=='play'||state.awaiting||!state.players[state.current].human)return;let p=state.current;if(b.dataset.handScroll){const hand=app.querySelector('#player-hand');if(hand)hand.scrollBy({left:(b.dataset.handScroll==='right'?1:-1)*Math.max(80,hand.clientWidth*.8),behavior:'smooth'});return}if(b.dataset.arrange){arranging=!arranging;render();return}if(b.dataset.move){let h=state.players[p].hand,i=h.findIndex(x=>x.id===state.selected),j=i+(b.dataset.move==='left'?-1:1);if(i>=0&&j>=0&&j<h.length){[h[i],h[j]]=[h[j],h[i]];render()}return}if(b.dataset.flip){let t=state.players[p].hand.find(x=>x.id===state.selected);if(t&&t.a!==t.b){t.flipped=!t.flipped;render()}return}if(b.dataset.sort){state.players[p].hand.sort((a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||Math.min(b.a,b.b)-Math.min(a.a,a.b));render();return}if(b.dataset.tile){state.selected=Number(b.dataset.tile);render();return}if(b.dataset.target!==undefined){let t=b.dataset.target==='m'?'m':Number(b.dataset.target),ti=state.players[p].hand.find(x=>x.id===state.selected);if(!ti||!eligible(t,p))return;let fit=fitting(ti,t);if(fit)doPlay({ti,t,...fit});return}if(b.dataset.draw){if(moves(p).length===0&&!state.turnDraw){drawOne();render()}return}if(b.dataset.pass){if(moves(p).length===0&&(state.turnDraw||!state.boneyard.length))cantPlay();return}});
render();})();
</script></body></html>
