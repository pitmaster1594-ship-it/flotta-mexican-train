(()=>{'use strict';const app=document.getElementById('app');const SAVE_KEY='flotta-mexican-train.saved.v1';let chosenStart=12;let saveIssue='';let state=null;let seq=0;let timer=null;let arranging=false;let ignoreNextClick=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeDeck(){let a=[];for(let i=0;i<=12;i++)for(let j=i;j<=12;j++)if(!(i===state.engine&&j===state.engine))a.push({id:++seq,a:i,b:j});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function players(mode){return mode===1?[{name:'You',human:true},{name:'Computer 1',human:false},{name:'Computer 2',human:false},{name:'Computer 3',human:false}]:[{name:'Player 1',human:true},{name:'Computer 1',human:false},{name:'Player 2',human:true},{name:'Computer 2',human:false}]}
function newGame(mode=1,startEngine=chosenStart){chosenStart=startEngine;arranging=false;clearTimeout(timer);state={mode,startEngine,engine:startEngine,round:0,players:players(mode),total:[0,0,0,0],phase:'play',current:0,turnDraw:false,pending:null,selected:null,selectedTrain:null,notice:'',awaiting:false,passes:0};dealRound()}
function dealRound(){clearTimeout(timer);state.players.forEach(p=>{p.hand=[];p.train=[];p.open=false});let deck=makeDeck();for(let i=0;i<15;i++)for(let p of state.players)p.hand.push(deck.pop());state.boneyard=deck;state.mex=[];state.current=0;state.turnDraw=false;state.pending=null;state.selected=null;state.selectedTrain=null;state.phase='play';state.passes=0;state.awaiting=false;state.notice='Round '+(state.round+1)+': double-'+state.engine+' starts all trains.';startTurn()}
function head(t){return t==='m'?state.mex.length?state.mex.at(-1).right:state.engine:state.players[t].train.length?state.players[t].train.at(-1).right:state.engine}
function accessible(t,p){return t==='m'||t===p||state.players[t].open}
function eligible(t,p){if(state.pending!==null)return state.pending===t;return accessible(t,p)}
function fitting(tile,t){let h=head(t);if(tile.a===h)return {left:tile.a,right:tile.b};if(tile.b===h)return {left:tile.b,right:tile.a};return null}
function moves(p){let opts=[];for(let ti of state.players[p].hand)for(let t of ['m',0,1,2,3])if(eligible(t,p)){let orient=fitting(ti,t);if(orient)opts.push({ti,t,...orient})}return opts}
function name(t){return t==='m'?'Mexican Train':state.players[t].name+"'s train"}
function nextPlayer(){arranging=false;state.current=(state.current+1)%4;state.turnDraw=false;state.selected=null;state.selectedTrain=null;startTurn()}
function endTurn(){if(state.players[state.current].hand.length===0){finishRound(state.current);return}state.passes=0;nextPlayer()}
function doPlay(m){let p=state.current,pl=state.players[p];let ix=pl.hand.findIndex(t=>t.id===m.ti.id);if(ix<0)return;pl.hand.splice(ix,1);const entry={...m.ti,left:m.left,right:m.right};if(m.t==='m')state.mex.push(entry);else{state.players[m.t].train.push(entry);if(m.t===p)pl.open=false}let hadPending=state.pending!==null;state.pending=null;state.turnDraw=false;state.selected=null;state.selectedTrain=null;state.notice=pl.name+' played '+m.left+'–'+m.right+' on '+name(m.t)+'.';if(m.left===m.right){state.pending=m.t;state.notice+=' Double! The next play must satisfy it.'}if(pl.hand.length===0){finishRound(p);return}state.passes=0;nextPlayer()}
function drawOne(){if(state.boneyard.length===0)return false;state.players[state.current].hand.push(state.boneyard.pop());state.turnDraw=true;state.notice=state.players[state.current].name+' drew a domino.';return true}
function cantPlay(){let p=state.current;if(state.pending===null)state.players[p].open=true;state.notice=state.players[p].name+' could not play. '+(state.pending===null?'Their train is now open.':'The double still needs matching.');state.passes++;if(state.passes>=4&&state.boneyard.length===0){finishRound(null);return}nextPlayer()}
function score(p){return state.players[p].hand.reduce((v,t)=>v+t.a+t.b,0)}
function finishRound(winner){state.phase='roundend';for(let i=0;i<4;i++)state.total[i]+=score(i);state.notice=winner===null?'No more plays available.':state.players[winner].name+' finished their dominoes!';render()}
function startTurn(){if(state.phase==='play'){state.awaiting=state.mode===2&&state.players[state.current].human}render();if(state.phase==='play'&&!state.players[state.current].human)timer=setTimeout(computerMove,650)}
function computerMove(){if(!state||state.phase!=='play'||state.players[state.current].human)return;let p=state.current;let opts=moves(p);if(opts.length){opts.sort((a,b)=>((b.ti.a+b.ti.b)-(a.ti.a+a.ti.b)) + ((a.t===p?1:0)-(b.t===p?1:0)));doPlay(opts[0]);return}if(!state.turnDraw&&drawOne()){render();timer=setTimeout(computerMove,500);return}cantPlay()}
const pipColors=['#89939b','#d44845','#2580c9','#28a06c','#b579c7','#d29b24','#152b38','#dc6a36','#934dba','#318892','#a2556a','#77882c','#d34c77'];
function face(v){return `<span class="numberface" style="color:${pipColors[v]}">${v}</span>`}
function shownEnds(t){return t.flipped?[t.b,t.a]:[t.a,t.b]}
function domino(t,cls='',disable=false,clickable=true){let [a,b]=shownEnds(t);return `<${clickable?'button':'span'} class="tile ${cls}" ${clickable?`data-tile="${t.id}" aria-pressed="${state?.selected===t.id}" ${disable?'disabled':''}`:''} aria-label="Domino ${a} ${b}"><span class="side pips">${face(a)}</span><span class="side pips">${face(b)}</span></${clickable?'button':'span'}>`}
function routeDominoes(list){return list.length?`<div class="route-row">${list.map(x=>domino({id:x.id,a:x.left,b:x.right},'small',false,false)).join('')}</div>`:'<p class="mini">No dominoes yet. Start with '+state.engine+'.</p>'}
function viewingPlayer(){return state.mode===1?0:state.players[state.current].human?state.current:state.current===1?0:2}
function openTrainMarker(){return `<span class="open-train-marker" role="img" aria-label="Open train" title="Open train"><svg viewBox="0 0 44 30" aria-hidden="true" focusable="false"><path d="M3 19h34l4 6H3z" fill="currentColor"/><path d="M8 12h16v10H8zM23 7h13v15H23zM11 6h5v7h-5z" fill="currentColor"/><path d="M26 10h7v6h-7z" fill="#214a35"/><path d="M9 4h9M5 10h3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="11" cy="25" r="4" fill="#214a35" stroke="currentColor" stroke-width="2"/><circle cx="26" cy="25" r="4" fill="#214a35" stroke="currentColor" stroke-width="2"/></svg></span>`}
function trainHTML(t,place){const p=state.current,pl=state.players[p],list=t==='m'?state.mex:state.players[t].train,allowed=state.phase==='play'&&pl.human&&!state.awaiting&&!arranging&&eligible(t,p),s=pl.hand.find(x=>x.id===state.selected),can=allowed&&s&&fitting(s,t),open=t==='m'||state.players[t].open,own=t===viewingPlayer(),label=t==='m'?'Mexican Train':own?'Your train':state.players[t].name;return `<section class="train ${place} ${allowed?'available':''} ${state.pending===t?'double-wait':''}" aria-label="${esc(label)}"><div class="lane-label"><span class="lane-name"><span>${esc(label)}</span></span><span class="trainstatus ${open?'open':''}">${state.pending===t?'Match double':t==='m'?'Shared':open?'Open':'Closed'} · ${list.length} played</span></div><div class="trail" data-lane="${t}" data-count="${list.length}" tabindex="0" aria-label="${esc(label)} dominoes; scroll to browse">${routeDominoes(list)}</div><div class="lane-actions"><button class="end-badge" data-lane-end="${t}" aria-label="Show newest domino on ${esc(label)}">End <span class="end-marker">${open?openTrainMarker():''}<b>${head(t)}</b></span></button>${allowed?`<button class="btn ${can?'primary':'secondary'}" data-target="${t}" aria-label="Play selected domino on ${esc(label)}" ${!can?'disabled':''}>Play</button>`:''}</div></section>`}
function followTrainEnds(){app.querySelectorAll('[data-lane]').forEach(el=>{el.scrollLeft=el.scrollWidth})}
window.addEventListener('resize',()=>requestAnimationFrame(followTrainEnds));
function validSave(record){
 if(!record||record.version!==1||!Number.isFinite(record.savedAt))return false;
 const s=record.state,isIndex=n=>Number.isInteger(n)&&n>=0&&n<4,isPip=n=>Number.isInteger(n)&&n>=0&&n<=12;
 if(!s||![1,2].includes(s.mode)||![12,9,6].includes(s.startEngine)||!Number.isInteger(s.round)||s.round<0||s.round>s.startEngine||s.engine!==s.startEngine-s.round||!isIndex(s.current)||!['play','roundend'].includes(s.phase)||![null,'m',0,1,2,3].includes(s.pending)||typeof s.turnDraw!=='boolean'||typeof s.awaiting!=='boolean'||typeof s.notice!=='string'||!Number.isInteger(s.passes)||s.passes<0||s.passes>4)return false;
 if(!Array.isArray(s.total)||s.total.length!==4||!s.total.every(n=>Number.isInteger(n)&&n>=0)||!Array.isArray(s.players)||s.players.length!==4||!Array.isArray(s.mex)||!Array.isArray(s.boneyard))return false;
 const expected=players(s.mode);if(!s.players.every((p,i)=>p&&p.name===expected[i].name&&p.human===expected[i].human&&typeof p.open==='boolean'&&Array.isArray(p.hand)&&Array.isArray(p.train)))return false;
 const tiles=[...s.boneyard,...s.mex,...s.players.flatMap(p=>[...p.hand,...p.train])];
 if(tiles.length!==90||!tiles.every(t=>t&&Number.isSafeInteger(t.id)&&t.id>0&&isPip(t.a)&&isPip(t.b))||new Set(tiles.map(t=>t.id)).size!==90||new Set(tiles.map(t=>[Math.min(t.a,t.b),Math.max(t.a,t.b)].join(':'))).size!==90||tiles.some(t=>t.a===s.engine&&t.b===s.engine))return false;
 return [s.mex,...s.players.map(p=>p.train)].every(train=>train.every((t,i)=>isPip(t.left)&&isPip(t.right)&&t.left===(i?train[i-1].right:s.engine)&&((t.left===t.a&&t.right===t.b)||(t.left===t.b&&t.right===t.a))));
}
function readSaved(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const record=JSON.parse(raw);if(!validSave(record)){saveIssue='The saved game could not be read. You can start a new game.';return null}saveIssue='';return record}catch(_){saveIssue='Saving is unavailable in this browser. Keep this page open to continue your game.';return null}}
function saveGame(){if(!state)return false;try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,savedAt:Date.now(),state}));saveIssue='';return true}catch(_){saveIssue='Saving is unavailable in this browser. Keep this page open to continue your game.';return false}}
function resumeGame(){const record=readSaved();if(!record){render();return}clearTimeout(timer);state=record.state;chosenStart=state.startEngine;seq=Math.max(...[...state.boneyard,...state.mex,...state.players.flatMap(p=>[...p.hand,...p.train])].map(t=>t.id));state.selected=null;arranging=false;startTurn()}
window.addEventListener('pagehide',()=>{if(state)saveGame()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state)saveGame()});
function render(){if(!state){const saved=readSaved();document.body.classList.add('lobby');app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><span class="pill">Dominoes · Double 12</span></div><div class="welcome"><h1>All aboard!</h1>${saved?`<section class="resume-panel"><h2>Continue your game</h2><p>Round ${saved.state.round+1} of ${saved.state.startEngine+1} · Double ${saved.state.engine}<br>${saved.state.mode===1?'1 player + 3 computers':'2 players + 2 computers'} · Saved ${esc(new Date(saved.savedAt).toLocaleString())}</p><button class="btn primary" data-resume="1">Resume saved game</button><p class="mini">Saved in this browser on this device.</p></section>`:''}${saveIssue?`<p class="save-warning" role="status">${esc(saveIssue)}</p>`:''}<p>Build your domino trains, play against computer opponents, and keep your score as low as possible.</p><fieldset class="start-options"><legend>Start a new game at</legend><div class="options">${[12,9,6].map(n=>`<button class="btn ${chosenStart===n?'primary':'secondary'}" data-start="${n}" aria-pressed="${chosenStart===n}">Double ${n}<span class="mini">${n+1} rounds</span></button>`).join('')}</div><p class="mini">Play down to double blank. All options use the same double-12 tiles.</p></fieldset><div class="options"><button class="btn primary" data-new="1">1 player + 3 computers</button><button class="btn primary" data-new="2">2 players + 2 computers</button></div><hr class="divider"><p class="how">Same-iPad two-player mode uses a private pass screen between human turns. This game plays one domino per turn, draws one when stuck, and requires doubles to be satisfied. House rules can be adjusted later.</p></div>`;return}
saveGame();
let p=state.current,pl=state.players[p],opts=state.phase==='play'?moves(p):[],human=pl.human&&!state.awaiting,hide=state.awaiting;
document.body.classList.remove('lobby');
const viewer=viewingPlayer(),opponents=[0,1,2,3].filter(i=>i!==viewer);
app.innerHTML=`<header class="top"><div class="brand">🚂 Flotta Mexican Train</div><div class="controls"><span class="pill">Round ${state.round+1} / ${state.startEngine+1}</span><span class="save-status">${saveIssue?'Not saved':'Autosaved on this device'}</span><button class="btn secondary" data-save-exit="1">Save &amp; exit</button><button class="btn secondary" data-reset="1">New game</button></div></header>${saveIssue?`<p class="save-warning" role="status">${esc(saveIssue)}</p>`:''}<section class="status-panel"><div class="turnline"><div class="turntitle">${state.phase==='play'?esc(pl.name)+(pl.human?' — your turn':' is thinking…'):'Round complete'}</div><span class="engine-badge">Starting double <b>${state.engine} | ${state.engine}</b> · Boneyard <b>${state.boneyard.length}</b></span></div><div class="scores">${state.players.map((x,i)=>`<div class="score ${i===p?'current':''}">${esc(x.name)} · <b>${state.total[i]}</b> pts · ${x.hand.length} tiles</div>`).join('')}</div><p class="message" role="status">${state.pending!==null?'⚠ Match the double on '+esc(name(state.pending))+'. ':''}${esc(state.notice)}</p></section><section class="tablepanel"><div class="tabletools"><h2>The table</h2><span class="eyebrow">${state.phase==='play'&&human?'Select a tile · choose a train':'Lowest score wins'}</span></div><div class="tabletop">${trainHTML('m','shared')}${opponents.map(i=>trainHTML(i,'opponent')).join('')}${trainHTML(viewer,'personal')}</div></section><section class="handpanel"><div class="handtitle"><h2>${state.phase==='play'&&human?'Your hand · '+pl.hand.length+' dominoes':'Your hand'}</h2>${state.phase==='play'&&human?`<button class="btn secondary" data-arrange="1" aria-expanded="${arranging}">${arranging?'Done arranging':'Arrange tiles'}</button>`:'<span class="mini">Waiting for your turn</span>'}</div>${state.phase==='play'&&human?`${arranging?'<p class="arrange-instructions" role="status">Drag any tile to move it. Or tap a tile, then tap another tile to place it before that tile. Tap Done arranging to play.</p>':'<p class="arrange-instructions">Drag tiles to move them, or tap Arrange tiles for tap-to-move controls.</p>'}<div class="handrail"><div id="player-hand" tabindex="0" data-owner="${p}" class="handwrap ${arranging?'reordering':''}" aria-label="Your dominoes">${pl.hand.map(t=>domino(t,'hand '+(state.selected===t.id?'sel ':'')+(opts.some(m=>m.ti.id===t.id)?'suggest':''))).join('')}</div></div><div class="hand-actions"><span class="mini">${state.turnDraw?'Domino drawn. Play it if you can.':opts.length?'All your tiles are below. Select one, then tap Play on a train.':'No matching tiles. '+(state.boneyard.length?'Draw one to continue.':'You can pass.')}</span><div class="controls"><button class="btn ${!opts.length&&!state.turnDraw&&state.boneyard.length?'primary':'secondary'}" data-draw="1" ${state.turnDraw||opts.length||!state.boneyard.length?'disabled':''}>Draw (${state.boneyard.length})</button><button class="btn ${!opts.length&&(state.turnDraw||!state.boneyard.length)?'primary':'secondary'}" data-pass="1" ${(!state.turnDraw&&state.boneyard.length>0)||opts.length?'disabled':''}>Pass</button></div></div>${arranging?`<div class="controls arrange-tools"><span class="mini">Move selected tile one place:</span><button class="btn secondary" data-move="left" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===0?'disabled':''}>◀ Left</button><button class="btn secondary" data-move="right" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===pl.hand.length-1?'disabled':''}>Right ▶</button><button class="btn secondary" data-flip="1" ${state.selected===null?'disabled':''}>Flip</button><button class="btn secondary" data-sort="1">Sort numbers</button></div>`:''}`:`<div class="handwrap"><p class="muted">${state.phase==='play'?'The next hand appears when it is your turn.':'Round complete. See the scores above.'}</p></div>`}</section><details class="how"><summary>How to play · House rules</summary><p>Play on your own train, any open train, or the shared Mexican Train. Draw one if you cannot play; if still stuck, pass. Passing opens your train unless a double is waiting. This version plays one domino per turn, including doubles: the next player must match the double before playing elsewhere. Lowest total pip score after ${state.startEngine+1} rounds wins. Your game saves automatically in this browser; use Save &amp; exit to pause it.</p></details>`;
followTrainEnds();requestAnimationFrame(followTrainEnds);
if(state.phase==='roundend'){const last=state.engine===0;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>${last?'🏆 Game over':'🎉 Round finished'}</h1><p>${esc(state.notice)}</p><div class="scores" style="justify-content:center">${state.players.map((x,i)=>`<div class="score">${esc(x.name)}<br>Round: ${score(i)} · Total: <b>${state.total[i]}</b></div>`).join('')}</div><div class="options">${last?`<button class="btn primary" data-new="${state.mode}">Play again</button>`:'<button class="btn primary" data-next="1">Next round</button>'}</div>${last?`<p>Winner: ${esc(state.players[state.total.indexOf(Math.min(...state.total))].name)} (lowest score).</p>`:''}</div></div>`)}
if(state.awaiting&&state.phase==='play'){app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>🙈 Pass the iPad</h1><p>Hand the iPad to <strong>${esc(pl.name)}</strong>. Other players should look away before you reveal the hand.</p><button class="btn primary" data-reveal="1">I'm ${esc(pl.name)} — reveal my dominoes</button></div></div>`)}
}
// Dragging works directly; Arrange also offers a two-tap alternative.
let dragState=null;
function reorderHand(id,beforeId,drop=false){const hand=state.players[state.current].hand,from=hand.findIndex(t=>t.id===id);if(from<0||id===beforeId||!hand.some(t=>t.id===beforeId))return;const [tile]=hand.splice(from,1);const to=hand.findIndex(t=>t.id===beforeId);hand.splice(to+(drop&&from<=to?1:0),0,tile);state.selected=tile.id}
function clearDrag(){if(!dragState)return;const d=dragState;dragState=null;d.el.classList.remove('dragging');app.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));try{d.el.releasePointerCapture(d.pointer)}catch(_){}return d}
app.addEventListener('pointerdown',e=>{const el=e.target.closest('.handwrap [data-tile]');if(!el||!state||state.awaiting||state.phase!=='play'||!state.players[state.current].human||e.button>0)return;clearDrag();dragState={id:Number(el.dataset.tile),owner:state.current,x:e.clientX,y:e.clientY,active:false,pointer:e.pointerId,el};try{el.setPointerCapture(e.pointerId)}catch(_){};});
app.addEventListener('pointermove',e=>{const d=dragState;if(!d||e.pointerId!==d.pointer)return;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>10)d.active=true;if(!d.active)return;e.preventDefault();d.el.classList.add('dragging');const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');app.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));if(dest&&dest!==d.el)dest.classList.add('drop-target')},{passive:false});
app.addEventListener('pointerup',e=>{if(!dragState||e.pointerId!==dragState.pointer)return;const d=clearDrag();if(!d.active)return;ignoreNextClick=true;setTimeout(()=>ignoreNextClick=false,400);const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');if(!dest||!state||state.awaiting||state.phase!=='play'||state.current!==d.owner)return;reorderHand(d.id,Number(dest.dataset.tile),true);render()});
app.addEventListener('pointercancel',()=>clearDrag());
app.addEventListener('click',e=>{if(ignoreNextClick){ignoreNextClick=false;return;}let b=e.target.closest('[data-start],[data-resume],[data-save-exit],[data-lane-end],[data-arrange],[data-new],[data-reset],[data-next],[data-reveal],[data-tile],[data-target],[data-draw],[data-pass],[data-move],[data-sort],[data-flip]');if(!b)return;if(b.dataset.laneEnd!==undefined){const lane=app.querySelector('[data-lane="'+b.dataset.laneEnd+'"]');if(lane)lane.scrollLeft=lane.scrollWidth;return}if(b.dataset.start){chosenStart=Number(b.dataset.start);render();return}if(b.dataset.resume){resumeGame();return}if(b.dataset.saveExit){if(saveGame()){clearTimeout(timer);clearDrag();state=null;arranging=false;render()}else{render();alert('This browser could not save the game. Keep this page open so you do not lose your progress.')}return}if(b.dataset.new){if(readSaved()&&!confirm('Start a new game and replace the saved game?'))return;newGame(Number(b.dataset.new));return}if(b.dataset.reset){if(confirm('Return to game setup? Your current game will remain saved if saving is available.')){if(state)saveGame();clearTimeout(timer);clearDrag();state=null;arranging=false;render()}return}if(b.dataset.next){state.round++;state.engine--;dealRound();return}if(b.dataset.reveal){state.awaiting=false;render();return}if(!state||state.phase!=='play'||state.awaiting||!state.players[state.current].human)return;let p=state.current;if(b.dataset.arrange){arranging=!arranging;state.selected=null;render();return}if(b.dataset.move){let h=state.players[p].hand,i=h.findIndex(x=>x.id===state.selected),j=i+(b.dataset.move==='left'?-1:1);if(i>=0&&j>=0&&j<h.length){[h[i],h[j]]=[h[j],h[i]];render()}return}if(b.dataset.flip){let t=state.players[p].hand.find(x=>x.id===state.selected);if(t&&t.a!==t.b){t.flipped=!t.flipped;render()}return}if(b.dataset.sort){state.players[p].hand.sort((a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||Math.min(b.a,b.b)-Math.min(a.a,a.b));render();return}if(b.dataset.tile){const id=Number(b.dataset.tile);if(arranging&&state.selected!==null&&state.selected!==id){reorderHand(state.selected,id);state.selected=null}else{state.selected=id}render();return}if(b.dataset.target!==undefined){let t=b.dataset.target==='m'?'m':Number(b.dataset.target),ti=state.players[p].hand.find(x=>x.id===state.selected);if(!ti||!eligible(t,p))return;let fit=fitting(ti,t);if(fit)doPlay({ti,t,...fit});return}if(b.dataset.draw){if(moves(p).length===0&&!state.turnDraw){drawOne();render()}return}if(b.dataset.pass){if(moves(p).length===0&&(state.turnDraw||!state.boneyard.length))cantPlay();return}});
render();})();
</script></body></html>
