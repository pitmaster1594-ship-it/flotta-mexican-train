<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102836"><title>Flotta Mexican Train</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f5e9;background:#102836}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{max-width:1200px;margin:auto;padding:12px 12px 30px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:clamp(21px,4vw,30px);font-weight:850}.muted{color:#bdd0d4}.pill{background:#244553;padding:6px 12px;border-radius:30px;font-size:13px}.panel{background:#183847;border:1px solid #3c6571;border-radius:15px;padding:12px;margin-top:10px}h1,h2,h3,p{margin:0 0 10px}h2{font-size:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{color:white;background:#327b83;border:1px solid #5cadb1;border-radius:11px;padding:10px 14px;font-weight:750}.btn:disabled{opacity:.36;cursor:default}.btn.secondary{background:#264a5a}.btn.primary{background:#d8ad51;color:#142d34;border-color:#f7d67c}.btn.active{outline:3px solid #fbe49c}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.train{background:#12313f;border:2px solid #315663;border-radius:12px;min-width:0;padding:10px;transition:border-color .15s}.train.available{border-color:#c5af61}.train.selected{border-color:#fff0a3;background:#244b53}.train.locked{opacity:.65}.trainhead{display:flex;gap:5px;align-items:center;justify-content:space-between;font-weight:760;margin-bottom:9px;flex-wrap:wrap}.trail{display:flex;gap:4px;align-items:center;min-height:53px;overflow-x:auto;padding-bottom:4px}.tile{display:inline-flex;flex-shrink:0;vertical-align:middle;border:2px solid #b0bac0;background:#f5f0da;color:#172e36;border-radius:8px;padding:3px;gap:3px;align-items:center;box-shadow:0 3px 0 #b6ad94;cursor:pointer}.tile .side{min-width:31px;height:32px;display:grid;place-items:center;font-size:18px;font-weight:900}.tile .side+ .side{border-left:2px solid #849497}.tile.hand{height:54px}.tile.hand .side{min-width:35px;height:39px}.tile.sel{outline:4px solid #efc963;transform:translateY(-3px)}.tile.suggest{outline:3px solid #76d9ac}.tile:disabled{opacity:.5}.tile.small{transform:scale(.84);transform-origin:left center;margin-right:-9px}.engine{background:#eac76f;color:#112d35;font-weight:900;padding:8px;border-radius:10px}.handwrap{display:flex;overflow-x:auto;gap:10px;align-items:center;padding:12px 3px 14px;min-height:80px}.message{background:#2b5260;padding:10px;border-radius:10px;margin:10px 0;min-height:43px}.scores{display:flex;flex-wrap:wrap;gap:8px}.score{padding:7px 10px;border-radius:10px;background:#102c39;font-size:13px}.overlay{position:fixed;inset:0;z-index:10;background:#092330ed;display:grid;place-items:center;padding:24px}.modal{background:#173b49;border:2px solid #65a0a8;border-radius:20px;padding:24px;max-width:500px;width:100%;text-align:center;box-shadow:0 20px 80px #0008}.modal h1{font-size:28px}.modal p{line-height:1.5}.options{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:16px 0}.mini{font-size:12px;color:#c5d9d9}.how{font-size:14px;line-height:1.45}.divider{border:0;border-top:1px solid #3b6470;margin:14px 0}@media(min-width:800px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.tile .side{min-width:37px}}@media(max-width:500px){#app{padding:8px 8px 22px}.board{gap:6px}.train{padding:7px}.tile .side{min-width:25px;height:27px;font-size:15px}.tile.hand .side{min-width:30px;height:33px}.tile.hand{height:47px}.brand{font-size:22px}.btn{padding:9px 11px}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const app=document.getElementById('app');const START=12;let state=null;let seq=0;let timer=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeDeck(){let a=[];for(let i=0;i<=12;i++)for(let j=i;j<=12;j++)if(!(i===state.engine&&j===state.engine))a.push({id:++seq,a:i,b:j});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function players(mode){return mode===1?[{name:'You',human:true},{name:'Computer 1',human:false},{name:'Computer 2',human:false},{name:'Computer 3',human:false}]:[{name:'Player 1',human:true},{name:'Computer 1',human:false},{name:'Player 2',human:true},{name:'Computer 2',human:false}]}
function newGame(mode=1){clearTimeout(timer);state={mode,engine:START,round:0,players:players(mode),total:[0,0,0,0],phase:'play',current:0,turnDraw:false,pending:null,selected:null,selectedTrain:null,notice:'',awaiting:false,passes:0};dealRound()}
function dealRound(){clearTimeout(timer);state.players.forEach(p=>{p.hand=[];p.train=[];p.open=false});let deck=makeDeck();for(let i=0;i<15;i++)for(let p of state.players)p.hand.push(deck.pop());state.boneyard=deck;state.mex=[];state.current=0;state.turnDraw=false;state.pending=null;state.selected=null;state.selectedTrain=null;state.phase='play';state.passes=0;state.awaiting=false;state.notice='Round '+(state.round+1)+': double-'+state.engine+' starts all trains.';startTurn()}
function head(t){return t==='m'?state.mex.length?state.mex.at(-1).right:state.engine:state.players[t].train.length?state.players[t].train.at(-1).right:state.engine}
function accessible(t,p){return t==='m'||t===p||state.players[t].open}
function eligible(t,p){if(state.pending!==null)return state.pending===t;return accessible(t,p)}
function fitting(tile,t){let h=head(t);if(tile.a===h)return {left:tile.a,right:tile.b};if(tile.b===h)return {left:tile.b,right:tile.a};return null}
function moves(p){let opts=[];for(let ti of state.players[p].hand)for(let t of ['m',0,1,2,3])if(eligible(t,p)){let orient=fitting(ti,t);if(orient)opts.push({ti,t,...orient})}return opts}
function name(t){return t==='m'?'Mexican Train':state.players[t].name+"'s train"}
function nextPlayer(){state.current=(state.current+1)%4;state.turnDraw=false;state.selected=null;state.selectedTrain=null;startTurn()}
function endTurn(){if(state.players[state.current].hand.length===0){finishRound(state.current);return}state.passes=0;nextPlayer()}
function doPlay(m){let p=state.current,pl=state.players[p];let ix=pl.hand.findIndex(t=>t.id===m.ti.id);if(ix<0)return;pl.hand.splice(ix,1);const entry={...m.ti,left:m.left,right:m.right};if(m.t==='m')state.mex.push(entry);else{state.players[m.t].train.push(entry);if(m.t===p)pl.open=false}let hadPending=state.pending!==null;state.pending=null;state.turnDraw=false;state.selected=null;state.selectedTrain=null;state.notice=pl.name+' played '+m.left+'–'+m.right+' on '+name(m.t)+'.';if(m.left===m.right){state.pending=m.t;state.notice+=' Double! The next play must satisfy it.'}if(pl.hand.length===0){finishRound(p);return}state.passes=0;nextPlayer()}
function drawOne(){if(state.boneyard.length===0)return false;state.players[state.current].hand.push(state.boneyard.pop());state.turnDraw=true;state.notice=state.players[state.current].name+' drew a domino.';return true}
function cantPlay(){let p=state.current;if(state.pending===null)state.players[p].open=true;state.notice=state.players[p].name+' could not play. '+(state.pending===null?'Their train is now open.':'The double still needs matching.');state.passes++;if(state.passes>=4&&state.boneyard.length===0){finishRound(null);return}nextPlayer()}
function score(p){return state.players[p].hand.reduce((v,t)=>v+t.a+t.b,0)}
function finishRound(winner){state.phase='roundend';for(let i=0;i<4;i++)state.total[i]+=score(i);state.notice=winner===null?'No more plays available.':state.players[winner].name+' finished their dominoes!';render()}
function startTurn(){render();if(state.phase!=='play')return;let p=state.current;if(state.players[p].human){state.awaiting=state.mode===2;render()}else{state.awaiting=false;render();timer=setTimeout(computerMove,650)}}
function computerMove(){if(!state||state.phase!=='play'||state.players[state.current].human)return;let p=state.current;let opts=moves(p);if(opts.length){opts.sort((a,b)=>((b.ti.a+b.ti.b)-(a.ti.a+a.ti.b)) + ((a.t===p?1:0)-(b.t===p?1:0)));doPlay(opts[0]);return}if(!state.turnDraw&&drawOne()){render();timer=setTimeout(computerMove,500);return}cantPlay()}
function tileHTML(t,cls='',disable=false){return `<button class="tile ${cls}" data-tile="${t.id}" ${disable?'disabled':''} aria-label="Domino ${t.a} ${t.b}"><span class="side">${t.a}</span><span class="side">${t.b}</span></button>`}
function trainHTML(t){let p=state.current,pl=state.players[p],list=t==='m'?state.mex:state.players[t].train,allowed=state.phase==='play'&&pl.human&&!state.awaiting&&eligible(t,p),s=state.selected!==null?pl.hand.find(x=>x.id===state.selected):null,can=allowed&&s&&fitting(s,t);return `<div class="train ${allowed?'available':''} ${state.selectedTrain===t?'selected':''} ${!allowed?'locked':''}" data-train="${t}"><div class="trainhead"><span>${t==='m'?'🚂 Mexican Train':(t===p?'⭐ ':'')+esc(state.players[t].name)+' train'}</span><span class="mini">${t==='m'?'Public':state.players[t].open?'🚩 Open':t===p?'Private · Yours':'Private'} · ${head(t)}</span></div><div class="trail"><span class="engine">${state.engine} | ${state.engine}</span>${list.map(x=>`<span class="tile small"><span class="side">${x.left}</span><span class="side">${x.right}</span></span>`).join('')}${list.length===0?'<span class="mini">Start here</span>':''}</div>${allowed?`<button class="btn ${can?'primary':'secondary'}" data-target="${t}" ${!can?'disabled':''}>Play here</button>`:''}</div>`}
function render(){if(!state){app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><span class="pill">Dominoes · Double 12</span></div><div class="panel" style="text-align:center;padding:24px"><h1>All aboard!</h1><p>Build your domino trains, play against computer opponents, and keep your score as low as possible.</p><div class="options"><button class="btn primary" data-new="1">1 player + 3 computers</button><button class="btn primary" data-new="2">2 players + 2 computers</button></div><hr class="divider"><p class="how">Same-iPad two-player mode uses a private pass screen between human turns. This first version plays one domino per turn, draws one when stuck, and requires doubles to be satisfied. House rules can be adjusted later.</p></div>`;return}
let p=state.current,pl=state.players[p],opts=state.phase==='play'?moves(p):[],human=pl.human&&!state.awaiting,hide=state.awaiting;
app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><div class="controls"><span class="pill">Round ${state.round+1} · Double ${state.engine}</span><button class="btn secondary" data-reset="1">New game</button></div></div><div class="panel"><div class="scores">${state.players.map((x,i)=>`<div class="score" style="border:${i===p?'2px solid #eac76f':'2px solid transparent'}">${esc(x.name)}: <b>${state.total[i]}</b> pts · ${x.hand.length} tiles</div>`).join('')}</div><div class="message">${esc(state.notice)}</div>${state.phase==='play'?`<strong>Turn: ${esc(pl.name)}</strong> · Boneyard: ${state.boneyard.length} · ${state.pending!==null?'⚠️ Double to match on '+esc(name(state.pending)): 'Choose a domino, then its destination train.'}`:''}</div><div class="panel"><h2>Train board</h2><div class="board">${['m',0,1,2,3].map(trainHTML).join('')}</div></div><div class="panel"><h2>${state.phase==='play'&&pl.human?'Your dominoes': 'Dominoes'} ${state.phase==='play'?`(${pl.hand.length})`:''}</h2>${state.phase==='play'&&human?`<div class="handwrap">${pl.hand.slice().sort((a,b)=>(b.a+b.b)-(a.a+a.b)).map(t=>tileHTML(t,'hand '+(state.selected===t.id?'sel ': '')+(opts.some(m=>m.ti.id===t.id)?'suggest':''))).join('')}</div><div class="controls"><button class="btn secondary" data-draw="1" ${state.turnDraw||opts.length||!state.boneyard.length?'disabled':''}>Draw a domino (${state.boneyard.length})</button><button class="btn secondary" data-pass="1" ${(!state.turnDraw&&state.boneyard.length>0)||opts.length?'disabled':''}>End turn / Pass</button><span class="mini">Highlighted tiles can be played. ${state.turnDraw?'You have drawn once this turn.':''}</span></div>`:state.phase==='play'?'<p class="muted">Computer is thinking…</p>':'<p class="muted">Round complete.</p>'}</div><div class="panel how"><b>Rules in this version:</b> Play on your own train, any open train, or the public Mexican Train. If you cannot play, draw one; if still stuck, pass and your train opens. A double must be matched before other trains can be played. Lowest total pip score wins after all rounds.</div>`;
if(state.phase==='roundend'){const last=state.engine===0;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>${last?'🏆 Game over':'🎉 Round finished'}</h1><p>${esc(state.notice)}</p><div class="scores" style="justify-content:center">${state.players.map((x,i)=>`<div class="score">${esc(x.name)}<br>Round: ${score(i)} · Total: <b>${state.total[i]}</b></div>`).join('')}</div><div class="options">${last?`<button class="btn primary" data-new="${state.mode}">Play again</button>`:'<button class="btn primary" data-next="1">Next round</button>'}</div>${last?`<p>Winner: ${esc(state.players[state.total.indexOf(Math.min(...state.total))].name)} (lowest score).</p>`:''}</div></div>`)}
if(state.awaiting&&state.phase==='play'){app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>🙈 Pass the iPad</h1><p>Hand the iPad to <strong>${esc(pl.name)}</strong>. Other players should look away before you reveal the hand.</p><button class="btn primary" data-reveal="1">I'm ${esc(pl.name)} — reveal my dominoes</button></div></div>`)}
}
app.addEventListener('click',e=>{let b=e.target.closest('[data-new],[data-reset],[data-next],[data-reveal],[data-tile],[data-target],[data-draw],[data-pass]');if(!b)return;if(b.dataset.new){newGame(Number(b.dataset.new));return}if(b.dataset.reset){if(confirm('Start a new game?')){state=null;render()}return}if(b.dataset.next){state.round++;state.engine--;dealRound();return}if(b.dataset.reveal){state.awaiting=false;render();return}if(!state||state.phase!=='play'||state.awaiting||!state.players[state.current].human)return;let p=state.current;if(b.dataset.tile){state.selected=Number(b.dataset.tile);render();return}if(b.dataset.target!==undefined){let t=b.dataset.target==='m'?'m':Number(b.dataset.target),ti=state.players[p].hand.find(x=>x.id===state.selected);if(!ti||!eligible(t,p))return;let fit=fitting(ti,t);if(fit)doPlay({ti,t,...fit});return}if(b.dataset.draw){if(moves(p).length===0&&!state.turnDraw){drawOne();render()}return}if(b.dataset.pass){if(moves(p).length===0&&(state.turnDraw||!state.boneyard.length))cantPlay();return}});
render();})();
</script></body></html>
