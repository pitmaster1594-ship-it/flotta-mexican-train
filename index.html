   const reverse=Math.floor(i/rowSize)%2===1;
   result.push(`<div class="route-row ${reverse?'reverse':''}">${row.map(x=>domino({id:x.id,a:x.left,b:x.right},'small',false,false)).join('')}${i+rowSize>=list.length?`<span class="route-end" title="Current train end">${list.at(-1).right} ◀</span>`:''}</div>`);
 }
 return result.join('');
}
function trainHTML(t,place){let p=state.current,pl=state.players[p],list=t==='m'?state.mex:state.players[t].train,allowed=state.phase==='play'&&pl.human&&!state.awaiting&&eligible(t,p),s=state.selected!==null?pl.hand.find(x=>x.id===state.selected):null,can=allowed&&s&&fitting(s,t);let open=t==='m'||state.players[t].open;return `<div class="train station ${place} ${allowed?'available':''} ${state.pending===t?'double-wait':''} ${!allowed?'locked':''}" data-train="${t}"><div class="trainhead"><span><span class="trainmark ${open?'':'closed'}">🚂</span> ${t==='m'?'Mexican Train':esc(state.players[t].name)}</span><span class="mini">${t==='m'?'Shared':open?'Open':t===p?'Yours':'Closed'} · ${head(t)}</span></div><div class="trail route">${routeDominoes(list,place)}</div>${allowed?`<button class="btn ${can?'primary':'secondary'}" data-target="${t}" ${!can?'disabled':''}>Play here</button>`:''}</div>`}
function render(){if(!state){app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><span class="pill">Dominoes · Double 12</span></div><div class="panel" style="text-align:center;padding:24px"><h1>All aboard!</h1><p>Build your domino trains, play against computer opponents, and keep your score as low as possible.</p><div class="options"><button class="btn primary" data-new="1">1 player + 3 computers</button><button class="btn primary" data-new="2">2 players + 2 computers</button></div><hr class="divider"><p class="how">Same-iPad two-player mode uses a private pass screen between human turns. This first version plays one domino per turn, draws one when stuck, and requires doubles to be satisfied. House rules can be adjusted later.</p></div>`;return}
let p=state.current,pl=state.players[p],opts=state.phase==='play'?moves(p):[],human=pl.human&&!state.awaiting,hide=state.awaiting;
app.innerHTML=`<div class="top"><div class="brand">🚂 Flotta Mexican Train</div><div class="controls"><span class="pill">Round ${state.round+1} · Double ${state.engine}</span><button class="btn secondary" data-reset="1">New game</button></div></div><div class="panel"><div class="scores">${state.players.map((x,i)=>`<div class="score" style="border:${i===p?'2px solid #eac76f':'2px solid transparent'}">${esc(x.name)}: <b>${state.total[i]}</b> pts · ${x.hand.length} tiles</div>`).join('')}</div><div class="message">${esc(state.notice)}</div>${state.phase==='play'?`<strong>Turn: ${esc(pl.name)}</strong> · Boneyard: ${state.boneyard.length} · ${state.pending!==null?'⚠️ Double to match on '+esc(name(state.pending)): 'Choose a domino, then its destination train.'}`:''}</div><div class="panel tablepanel"><div class="tabletools"><h2>Domino table</h2><div class="controls"><button class="btn secondary" data-zoom="out" aria-label="Zoom out">−</button><span class="pill">Zoom <b id="zoomlabel">${Math.round(zoom*100)}%</b></span><button class="btn secondary" data-zoom="in" aria-label="Zoom in">+</button><button class="btn secondary" data-zoom="reset">Reset view</button></div></div><div class="tablescroll" id="tablescroll"><div class="tabletop" style="zoom:${zoom}">${trainHTML(0,'north')}${trainHTML(1,'west')}<div class="tablehub"><span class="hubtitle">START</span><span class="hubdouble">${state.engine}│${state.engine}</span><span class="hubtitle">ROUND ${state.round+1}</span></div>${trainHTML(2,'east')}${trainHTML(3,'southwest')}${trainHTML('m','southeast')}</div></div><p class="tipline">Long trains bend into rows; scroll inside a train to follow it. Use + / − to adjust the view. Select a domino below, then tap Play here on a train.</p></div><div class="panel handpanel"><div class="handtitle"><h2>${state.phase==='play'&&pl.human?'Your dominoes': 'Dominoes'} ${state.phase==='play'?`(${pl.hand.length})`:''}</h2><span class="mini">Drag tiles to reorder · tap to select or flip</span></div>${state.phase==='play'&&human?`<div class="handwrap">${pl.hand.map(t=>domino(t,'hand '+(state.selected===t.id?'sel ': '')+(opts.some(m=>m.ti.id===t.id)?'suggest':''))).join('')}</div><div class="controls"><button class="btn secondary" data-move="left" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===0?'disabled':''}>◀ Move left</button><button class="btn secondary" data-move="right" ${state.selected===null||pl.hand.findIndex(x=>x.id===state.selected)===pl.hand.length-1?'disabled':''}>Move right ▶</button><button class="btn secondary" data-flip="1" ${state.selected===null?'disabled':''}>↔ Flip selected</button><button class="btn secondary" data-sort="1">Sort numbers</button><button class="btn secondary" data-draw="1" ${state.turnDraw||opts.length||!state.boneyard.length?'disabled':''}>Draw a domino (${state.boneyard.length})</button><button class="btn secondary" data-pass="1" ${(!state.turnDraw&&state.boneyard.length>0)||opts.length?'disabled':''}>End turn / Pass</button><span class="mini">Highlighted tiles can be played. ${state.turnDraw?'You have drawn once this turn.':''}</span></div>`:state.phase==='play'?'<p class="muted">Computer is thinking…</p>':'<p class="muted">Round complete.</p>'}</div><div class="panel how"><b>Rules in this version:</b> Play on your own train, any open train, or the public Mexican Train. If you cannot play, draw one; if still stuck, pass and your train opens. A double must be matched before other trains can be played. Lowest total pip score wins after all rounds.</div>`;
if(state.phase==='roundend'){const last=state.engine===0;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>${last?'🏆 Game over':'🎉 Round finished'}</h1><p>${esc(state.notice)}</p><div class="scores" style="justify-content:center">${state.players.map((x,i)=>`<div class="score">${esc(x.name)}<br>Round: ${score(i)} · Total: <b>${state.total[i]}</b></div>`).join('')}</div><div class="options">${last?`<button class="btn primary" data-new="${state.mode}">Play again</button>`:'<button class="btn primary" data-next="1">Next round</button>'}</div>${last?`<p>Winner: ${esc(state.players[state.total.indexOf(Math.min(...state.total))].name)} (lowest score).</p>`:''}</div></div>`)}
if(state.awaiting&&state.phase==='play'){app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><h1>🙈 Pass the iPad</h1><p>Hand the iPad to <strong>${esc(pl.name)}</strong>. Other players should look away before you reveal the hand.</p><button class="btn primary" data-reveal="1">I'm ${esc(pl.name)} — reveal my dominoes</button></div></div>`)}
}
// Pointer-based hand reordering works with fingers, pens and mice.
let dragState=null;
app.addEventListener('pointerdown',e=>{const el=e.target.closest('.handwrap [data-tile]');if(!el||!state||state.awaiting||!state.players[state.current].human)return;dragState={id:Number(el.dataset.tile),x:e.clientX,y:e.clientY,active:false,pointer:e.pointerId,el};try{el.setPointerCapture(e.pointerId)}catch(_){};},{passive:true});
app.addEventListener('pointermove',e=>{if(!dragState||e.pointerId!==dragState.pointer)return;if(Math.abs(e.clientX-dragState.x)>12||Math.abs(e.clientY-dragState.y)>12){dragState.active=true;dragState.el.classList.add('dragging');const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');document.querySelectorAll('.handwrap .drop-target').forEach(n=>n.classList.remove('drop-target'));if(dest&&dest!==dragState.el)dest.classList.add('drop-target')}},{passive:true});
function endDrag(e){if(!dragState||e.pointerId!==dragState.pointer)return;const d=dragState;dragState=null;document.querySelectorAll('.handwrap .drop-target').forEach(n=>n.classList.remove('drop-target'));if(!d.active)return;try{d.el.releasePointerCapture(d.pointer)}catch(_){};ignoreNextClick=true;setTimeout(()=>ignoreNextClick=false,100);const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.handwrap [data-tile]');if(!dest||!state||state.awaiting)return;const hand=state.players[state.current].hand;const from=hand.findIndex(t=>t.id===d.id),to=hand.findIndex(t=>t.id===Number(dest.dataset.tile));if(from<0||to<0||from===to)return;const [tile]=hand.splice(from,1);hand.splice(to,0,tile);state.selected=tile.id;render()}
app.addEventListener('pointerup',endDrag);app.addEventListener('pointercancel',()=>{dragState=null;});
app.addEventListener('click',e=>{if(ignoreNextClick){ignoreNextClick=false;return;}let b=e.target.closest('[data-new],[data-reset],[data-next],[data-reveal],[data-tile],[data-target],[data-draw],[data-pass],[data-move],[data-sort],[data-flip],[data-zoom]');if(!b)return;if(b.dataset.new){newGame(Number(b.dataset.new));return}if(b.dataset.reset){if(confirm('Start a new game?')){state=null;render()}return}if(b.dataset.next){state.round++;state.engine--;dealRound();return}if(b.dataset.reveal){state.awaiting=false;render();return}if(b.dataset.zoom){zoom=Math.max(.65,Math.min(1.7,b.dataset.zoom==='reset'?1:zoom+(b.dataset.zoom==='in'?.15:-.15)));render();return}if(!state||state.phase!=='play'||state.awaiting||!state.players[state.current].human)return;let p=state.current;if(b.dataset.move){let h=state.players[p].hand,i=h.findIndex(x=>x.id===state.selected),j=i+(b.dataset.move==='left'?-1:1);if(i>=0&&j>=0&&j<h.length){[h[i],h[j]]=[h[j],h[i]];render()}return}if(b.dataset.flip){let t=state.players[p].hand.find(x=>x.id===state.selected);if(t&&t.a!==t.b){t.flipped=!t.flipped;render()}return}if(b.dataset.sort){state.players[p].hand.sort((a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||Math.min(b.a,b.b)-Math.min(a.a,a.b));render();return}if(b.dataset.tile){state.selected=Number(b.dataset.tile);render();return}if(b.dataset.target!==undefined){let t=b.dataset.target==='m'?'m':Number(b.dataset.target),ti=state.players[p].hand.find(x=>x.id===state.selected);if(!ti||!eligible(t,p))return;let fit=fitting(ti,t);if(fit)doPlay({ti,t,...fit});return}if(b.dataset.draw){if(moves(p).length===0&&!state.turnDraw){drawOne();render()}return}if(b.dataset.pass){if(moves(p).length===0&&(state.turnDraw||!state.boneyard.length))cantPlay();return}});
render();})();
